appId: org.wikipedia
---
# Diagnostic only (not a test): skip onboarding the way the flows do, then stop on Home.
- tapOn:
    id: "org.wikipedia:id/fragment_onboarding_skip_button"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000
