appId: org.wikipedia
---
# Diagnostic only (not a test): skip onboarding the way the flows do, then stop on Home.
- tapOn:
    id: "org.wikipedia:id/fragment_onboarding_skip_button"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
# This app build has no Skip on the first screens, only a "Forward" arrow: page through
# the carousel by that button until it is gone (capped), then accept the last screen.
- repeat:
    while:
      visible: "Forward"
    times: 6
    commands:
      - tapOn: "Forward"
- tapOn:
    text: "Get started"
    optional: true
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000
