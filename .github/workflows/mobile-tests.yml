name: Mobile QA - Maestro

on:
  pull_request:
  workflow_dispatch:

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest # macos-latest não suporta HVF/virtualização aninhada de forma confiável para emulador Android; ubuntu-latest + KVM é o combo documentado que funciona
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Maestro version
        run: maestro --version

      - name: Download sample APK (Wikipedia - open source, via F-Droid)
        run: |
          mkdir -p app
          curl -L -o app/wikipedia.apk "https://f-droid.org/repo/org.wikipedia_50598.apk"
          # Nota: URL fixa numa versão específica (build 50598) de propósito -
          # evita que o CI quebre silenciosamente se uma nova versão do app
          # mudar algum texto/elemento usado nos asserts dos flows.

      - name: Run Android emulator + Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64 # ubuntu-latest runners são x86_64
          profile: pixel_6
          script: |
            mkdir -p results
            adb install app/wikipedia.apk
            # System error dialogs ("Pixel Launcher isn't responding") cover the whole
            # screen on slow CI emulators and every flow fails behind them.
            adb shell settings put global hide_error_dialogs 1
            adb shell input keyevent KEYCODE_HOME
            maestro test maestro/mobile/flows/ --format junit --output results/mobile-report.xml || touch results/FAILED
            if [ -f results/FAILED ]; then bash scripts/ci_probe_screens.sh || true; fi
            test ! -f results/FAILED

      - name: Collect test run data
        if: always()
        run: python3 scripts/collect_ci_data.py --junit-report results/mobile-report.xml

      - name: Generate test dashboard
        if: always()
        run: python3 scripts/generate_dashboard.py

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard
          path: reports/test-dashboard.html
          retention-days: 90

      - name: Upload Maestro debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash notifications/slack_notify.sh "Mobile" "${{ job.status }}"