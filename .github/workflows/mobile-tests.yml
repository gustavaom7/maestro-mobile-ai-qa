name: Mobile QA - Maestro

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 09:00 UTC
  pull_request:
  workflow_dispatch:

jobs:
  mobile-e2e:
    runs-on: macos-latest # emuladores Android rodam com aceleração de hardware em runners macOS/Linux com KVM
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Download sample APK (Wikipedia - open source)
        run: |
          mkdir -p app
          # Substituir pela URL de release oficial da versão desejada do app
          curl -L -o app/wikipedia.apk "https://f-droid.org/repo/org.wikipedia_50598.apk"

      - name: Run Android emulator + Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install app/wikipedia.apk
            maestro test maestro/mobile/flows/ --format junit --output results/mobile-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-maestro-report
          path: results/mobile-report.xml

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash notifications/slack_notify.sh "Mobile" "${{ job.status }}"
