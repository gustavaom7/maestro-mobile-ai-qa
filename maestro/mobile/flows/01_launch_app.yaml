appId: org.wikipedia
---
# FLOW: Launch and verify home screen
# AUTO-HEALING STRATEGY:
# - Onboarding: clean app state, then skip by the Skip button (id, with a text fallback), never by coordinates
# - Chrome redirect risk: optional account dismissal handles external link interception
# - Final assertion: waits for stable render before screenshot
- launchApp:
    clearState: true
# CI emulators sometimes raise "Pixel Launcher isn't responding" over every app; it
# hides the whole screen from Maestro. Keep waiting on it rather than closing the launcher.
- tapOn:
    id: "android:id/aerr_wait"
    optional: true
# Skip onboarding by its button, never by tapping screen coordinates: once the carousel
# is gone, a bottom-right tap lands on More -> Donate and opens a Chrome tab inside the
# app's task, and every later step runs against that web page instead of the app.
- tapOn:
    id: "org.wikipedia:id/fragment_onboarding_skip_button"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
# Handle external link redirect to Chrome (if "Learn more" was tapped)
# This optional command gracefully recovers if account prompt appeared
- tapOn:
    text: "Use without an account"
    optional: true
# Re-launch app in case external redirect happened
- launchApp:
    stopApp: false
# Wait for home content to stabilize (prevents flaky assertions on slow renders)
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: "Content and resources selected by and about the Wikimedia community"
- takeScreenshot: launch_screen
