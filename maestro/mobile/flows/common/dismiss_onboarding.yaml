# Sub-flow reutilizável: dispensa o carrossel de boas-vindas que só aparece
# na primeira abertura do app após uma instalação limpa (como no emulador do CI).
# Usa tap por posição (não por texto) porque o botão é um ícone de seta sem
# texto, e "optional: true" garante que não falha caso a tela já tenha sido
# dispensada (ex: rodando localmente num device que já passou pelo onboarding).
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true