appId: org.wikipedia
---
# FLOW: Save an article, remove it from Saved, and verify it's gone from the list
# AUTO-HEALING STRATEGY:
# - Onboarding: clean app state, then the shared skip_onboarding subflow (buttons only, never coordinates)
# - Donate modal: optional close by id (org.wikipedia:id/closeButton), never a blind corner tap
# - Ensure-saved step: the "Save" label never changes text between states, so this
#   flow first guarantees the article IS saved (tapping Save, then dismissing the
#   management menu without choosing an option if it turns out it was already
#   saved) before attempting to remove it - removal only works from a definitely
#   saved state
# - Empty-list assertion: relies on "Maestro" being the only saved article at this
#   point (the whole "Default list..." row disappears when the list is empty); if
#   a future flow leaves other articles saved, this needs to check for "Maestro"
#   specifically instead of the list's emptiness
- launchApp:
    clearState: true
# CI emulators sometimes raise "Pixel Launcher isn't responding" over every app; it
# hides the whole screen from Maestro. Keep waiting on it rather than closing the launcher.
- tapOn:
    id: "android:id/aerr_wait"
    optional: true
- runFlow: ../subflows/skip_onboarding.yaml
# Handle external redirect if "Learn more" was tapped
- tapOn:
    text: "Use without an account"
    optional: true
# Re-launch after potential redirect
- launchApp:
    stopApp: false
# Close donate modal if it appears
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
# Navigate to search and look up "Maestro"
- waitForAnimationToEnd:
    timeout: 300
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 300
- tapOn: "Search Wikipedia"
- waitForAnimationToEnd:
    timeout: 300
- inputText: "Maestro"
- waitForAnimationToEnd:
    timeout: 800
# The search screen's language tab (EN/PT) can default back to the device's
# region language between runs, independent of the app's own language
# settings. Force English explicitly instead of assuming it's already active.
- tapOn:
    text: "ENGLISH"
    optional: true
# Match on the result's subtitle instead of "Maestro" text/index: with search
# history enabled, a bare "Maestro" match can land on the search input itself
# (which already contains that typed text) instead of the result row.
- assertVisible: "Title of respect given to a master musician"
- tapOn: "Title of respect given to a master musician"
- waitForAnimationToEnd:
    timeout: 800
# "Save" only exists in the article's bottom toolbar, so finding it confirms
# we actually navigated into the article (not still on the results list).
- assertVisible: "Save"
# Ensure the article is saved first: tap Save, and if it was already saved
# (management menu appears), just dismiss the menu without picking an option.
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 500
- runFlow:
    when:
      visible: "Remove from Saved"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 300
# Now definitely saved: tap Save again to open the management menu and remove it
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 500
- assertVisible: "Remove from Saved"
- tapOn: "Remove from Saved"
- waitForAnimationToEnd:
    timeout: 500
- takeScreenshot: article_removed
# Back out to Home, then confirm the Saved list no longer has the default list row
- back
- back
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- tapOn: "Saved"
- waitForAnimationToEnd:
    timeout: 400
- assertNotVisible: "Default list for your saved articles"
- takeScreenshot: saved_list_empty
