appId: org.wikipedia
---
# FLOW: Search for a term with no matches and verify the "No results" state
# AUTO-HEALING STRATEGY:
# - Onboarding: clean app state, then skip by the Skip button (id, with a text fallback), never by coordinates
# - Donate modal: optional close via the "Close" content-desc button (more
#   reliable than a blind coordinate tap - see 06_change_language's findings)
# - Nonsense query: long random alphanumeric string, extremely unlikely to ever
#   match a real Wikipedia article title in either language
- launchApp:
    clearState: true
# Skip onboarding by its button, never by tapping screen coordinates: once the carousel
# is gone, a bottom-right tap lands on More -> Donate and opens a Chrome tab inside the
# app's task, and every later step runs against that web page instead of the app.
- tapOn:
    id: "org.wikipedia:id/fragment_onboarding_skip_button"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
# Handle external redirect if "Learn more" was tapped
- tapOn:
    text: "Use without an account"
    optional: true
# Re-launch after potential redirect
- launchApp:
    stopApp: false
# Close donate modal if it appears
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
# Navigate to search and look up a nonsense term
- waitForAnimationToEnd:
    timeout: 300
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 300
- tapOn: "Search Wikipedia"
- waitForAnimationToEnd:
    timeout: 300
- inputText: "zzxqjkasdqweasdzzznonexistentterm123"
- waitForAnimationToEnd:
    timeout: 800
- assertVisible: "No results"
- takeScreenshot: search_no_results
# Clear the query and back out to Home
- tapOn:
    id: "org.wikipedia:id/search_close_btn"
    optional: true
- back
- back
