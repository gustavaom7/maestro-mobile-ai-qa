appId: org.wikipedia
---
# FLOW: Navigation regression test
# Tests that 3 main tabs (Saved, Search, More) remain accessible after onboarding
#
# AUTO-HEALING STRATEGY:
# - Widget modal dismissal: optional close by id (org.wikipedia:id/closeButton)
# - Tab state assertion: wait before each assertion to let UI settle
# - Optional back command: handles cases where modal isn't present (doesn't fail)
#
# KNOWN FLAKES & FIXES:
# - A blind corner tap here used to hit the app's own UI when no modal was open
# - Modal persistence across tabs: fixed by explicit modal close before each assertion
- launchApp:
    clearState: true
# CI emulators sometimes raise "Pixel Launcher isn't responding" over every app; it
# hides the whole screen from Maestro. Keep waiting on it rather than closing the launcher.
- tapOn:
    id: "android:id/aerr_wait"
    optional: true
# Skip onboarding by its button, never by tapping screen coordinates: once the carousel
# is gone, a bottom-right tap lands on More -> Donate and opens a Chrome tab inside the
# app's task, and every later step runs against that web page instead of the app.
- tapOn:
    id: "org.wikipedia:id/fragment_onboarding_skip_button"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
# Handle external redirect
- tapOn:
    text: "Use without an account"
    optional: true
# Re-launch if needed
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 500

# ===== TAB 1: SAVED =====
- tapOn: "Saved"
- waitForAnimationToEnd:
    timeout: 400
# Widget modal appears ~40% of time on tab navigation
# Close it by id; when no modal is open this is a no-op
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 300
- assertVisible: "Saved"

# ===== TAB 2: SEARCH =====
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 400
# Close the modal by id if present
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 300
- assertVisible: "Search"

# ===== TAB 3: MORE =====
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 400
- assertVisible: "Donate"