appId: org.wikipedia
---
# Regressão simples: garante que as 4 abas principais continuam acessíveis
# depois de qualquer mudança na navegação
- launchApp
- runFlow: common/dismiss_onboarding.yaml
- assertVisible: "Explore"
- tapOn: "Saved"
- assertVisible: "Saved"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Nearby"
- assertVisible: "Nearby"
- tapOn: "Explore"
- assertVisible: "Explore"
