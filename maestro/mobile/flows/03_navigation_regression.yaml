appId: org.wikipedia
---
# Simple regression: ensures the 4 main tabs remain accessible
# after any navigation change
- launchApp
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
# One of the onboarding taps can open an external link ("Learn more about
# Wikipedia"), which opens Chrome instead of continuing in the app. Dismiss
# that account prompt if it appears, then bring Wikipedia back to foreground.
- tapOn:
    text: "Use without an account"
    optional: true
- launchApp:
    stopApp: false
# Widget suggestion modal sometimes appears. Close it if present.
- tapOn:
    point: "95%,5%"
    optional: true
- assertVisible: "Explore"
- tapOn: "Explore"
- assertVisible: "Explore"
- tapOn: "Saved"
- assertVisible: "Saved"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Nearby"
- assertVisible: "Nearby"
- tapOn: "Explore"
- assertVisible: "Explore"
