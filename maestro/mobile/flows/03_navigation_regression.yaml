appId: org.wikipedia
---
# Simple regression: ensures the 4 main tabs remain accessible
# after any navigation change
- launchApp
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
# One of the onboarding taps can open an external link ("Learn more about
# Wikipedia"), which opens Chrome instead of continuing in the app. Dismiss
# that account prompt if it appears, then bring Wikipedia back to foreground.
- tapOn:
    text: "Use without an account"
    optional: true
- launchApp:
    stopApp: false
- assertVisible: "Saved"
- tapOn: "Saved"
- assertVisible: "Search"
- tapOn: "Search"
# Donate modal sometimes appears after tapping Search. Close it if present.
- tapOn:
    point: "5%,5%"
    optional: true
# Widget can appear after tapping Search. Close it if present.
- tapOn:
    point: "95%,5%"
    optional: true
- assertVisible: "More"
- tapOn: "More"
- assertVisible: "Home"
- tapOn: "Home"
