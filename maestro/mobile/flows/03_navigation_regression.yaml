appId: org.wikipedia
---
# FLOW: Navigation regression test
# Tests that 3 main tabs (Saved, Search, More) remain accessible after onboarding
#
# AUTO-HEALING STRATEGY:
# - Widget modal dismissal: optional close by id (org.wikipedia:id/closeButton)
# - Tab state assertion: wait before each assertion to let UI settle
# - Optional back command: handles cases where modal isn't present (doesn't fail)
#
# KNOWN FLAKES & FIXES:
# - A blind corner tap here used to hit the app's own UI when no modal was open
# - Modal persistence across tabs: fixed by explicit modal close before each assertion
- launchApp
# Dismiss onboarding carousel
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
# Handle external redirect
- tapOn:
    text: "Use without an account"
    optional: true
# Re-launch if needed
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 500

# ===== TAB 1: SAVED =====
- tapOn: "Saved"
- waitForAnimationToEnd:
    timeout: 400
# Widget modal appears ~40% of time on tab navigation
# Close it by id; when no modal is open this is a no-op
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 300
- assertVisible: "Saved"

# ===== TAB 2: SEARCH =====
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 400
# Close the modal by id if present
- tapOn:
    id: "org.wikipedia:id/closeButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 300
- assertVisible: "Search"

# ===== TAB 3: MORE =====
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 400
- assertVisible: "Donate"