appId: org.wikipedia
---
# FLOW: Navigation regression test
# Tests that 3 main tabs (Saved, Search, More) remain accessible after onboarding
#
# AUTO-HEALING STRATEGY:
# - Widget modal dismissal: tries close at 95%,5% + optional back (2-step recovery)
# - Tab state assertion: wait before each assertion to let UI settle
# - Optional back command: handles cases where modal isn't present (doesn't fail)
#
# KNOWN FLAKES & FIXES:
# - Widget modal z-index issue: fixed by using 95%,5% tap position instead of center
# - Modal persistence across tabs: fixed by explicit modal close before each assertion
- launchApp
# Dismiss onboarding carousel
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
# Handle external redirect
- tapOn:
    text: "Use without an account"
    optional: true
# Re-launch if needed
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 500

# ===== TAB 1: SAVED =====
- tapOn: "Saved"
- waitForAnimationToEnd:
    timeout: 400
# Widget modal appears ~40% of time on tab navigation
# Close it using top-right corner (95%,5%) - proven reliable on Galaxy A15
- tapOn:
    point: "95%,5%"
    optional: true
# Optional back if modal triggered back navigation (idempotent if not present)
- back:
    optional: true
- waitForAnimationToEnd:
    timeout: 300
- assertVisible: "Saved"

# ===== TAB 2: SEARCH =====
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 400
# Close modal using same 95%,5% position
- tapOn:
    point: "95%,5%"
    optional: true
- waitForAnimationToEnd:
    timeout: 300
- assertVisible: "Search"

# ===== TAB 3: MORE =====
- tapOn: "More"
- waitForAnimationToEnd:
    timeout: 400
- assertVisible: "Donate"