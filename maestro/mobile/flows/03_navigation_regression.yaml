appId: org.wikipedia
---
# Simple regression: ensures the 4 main tabs remain accessible
# after any navigation change
- launchApp
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
# One of the onboarding taps can open an external link ("Learn more about
# Wikipedia"), which opens Chrome instead of continuing in the app. Dismiss
# that account prompt if it appears, then bring Wikipedia back to foreground.
- tapOn:
    text: "Use without an account"
    optional: true
- launchApp:
    stopApp: false
# Test Saved tab
- tapOn: "Saved"
# Widget suggestion modal can appear. Close it if present.
- tapOn:
    point: "95%,5%"
    optional: true
- assertVisible: "Saved"
# Test Search tab
- tapOn: "Search"
# Widget suggestion modal can appear. Try multiple ways to close it.
- tapOn:
    point: "95%,5%"
    optional: true
- back:
    optional: true
- assertVisible: "Search"
# Test More tab
- tapOn: "More"
# Widget suggestion modal can appear. Close it if present.
- tapOn:
    point: "95%,5%"
    optional: true
- back:
    optional: true
# Assert a visible element in the More menu (e.g., Donate button)
- assertVisible: "Donate"
# Return to home
- back