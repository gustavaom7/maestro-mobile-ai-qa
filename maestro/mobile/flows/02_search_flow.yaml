appId: org.wikipedia
---
- launchApp
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
# One of the onboarding taps can open an external link ("Learn more about
# Wikipedia"), which opens Chrome instead of continuing in the app. Dismiss
# that account prompt if it appears, then bring Wikipedia back to foreground.
- tapOn:
    text: "Use without an account"
    optional: true
- launchApp:
    stopApp: false
- tapOn: "Search"
# Donate modal sometimes appears after tapping Search. Close it if present.
- tapOn:
    point: "5%,5%"
    optional: true
- inputText: "Maestro"
- assertVisible:
    text: "Maestro"
    index: 0
- tapOn:
    text: "Maestro"
    index: 0
- assertVisible: "Title of respect given to a master musician"
- takeScreenshot: search_result
- back
- back
