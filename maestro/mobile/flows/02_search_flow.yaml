appId: org.wikipedia
---
- launchApp
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "95%,95%"
          optional: true
- tapOn: "Search"
- inputText: "Maestro"
- assertVisible:
    text: "Maestro"
    index: 0
- tapOn:
    text: "Maestro"
    index: 0
- assertVisible: "Title of respect given to a master musician"
- takeScreenshot: search_result
- back
- back
